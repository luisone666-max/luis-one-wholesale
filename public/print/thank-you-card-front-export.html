<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luis One Card Front Export</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1800px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #fffaf7;
        color: #161616;
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        position: relative;
        width: 1800px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 84% 8%, rgba(244, 81, 22, 0.16), transparent 34%),
          linear-gradient(135deg, #fff 0%, #fffaf7 100%);
      }

      .stripe {
        position: absolute;
        inset: 0 auto 0 0;
        width: 34px;
        background: linear-gradient(180deg, #f45116, #c7350a);
      }

      .inner {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 500px;
        gap: 68px;
        padding: 72px 90px 60px 112px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 44px;
      }

      .brand img {
        width: 160px;
        height: 160px;
        border-radius: 999px;
        object-fit: cover;
        border: 12px solid #fff;
        box-shadow: 0 36px 78px rgba(244, 81, 22, 0.24);
      }

      .brand strong {
        display: block;
        font-size: 82px;
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .brand span {
        display: block;
        margin-top: 18px;
        color: #f45116;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 0.22em;
      }

      h1 {
        margin: 54px 0 24px;
        color: #c7350a;
        font-size: 86px;
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .text {
        max-width: 980px;
        margin: 0;
        color: #3e3e3e;
        font-size: 38px;
        line-height: 1.26;
        font-weight: 800;
      }

      .search-box {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin-top: 38px;
        border: 6px solid #ffd4bf;
        border-radius: 999px;
        background: #fff;
        padding: 22px 36px;
        color: #c7350a;
        font-size: 40px;
        line-height: 1;
        font-weight: 900;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 30px;
      }

      .chip {
        border-radius: 999px;
        background: #fff2ea;
        color: #7a3214;
        padding: 18px 28px;
        font-size: 30px;
        line-height: 1;
        font-weight: 900;
        white-space: nowrap;
      }

      .front-side {
        display: grid;
        align-items: center;
        justify-items: center;
        border-left: 5px solid #f0d4c3;
        padding-left: 68px;
      }

      .front-side strong {
        display: block;
        color: #161616;
        font-size: 76px;
        line-height: 1.04;
        text-align: center;
        letter-spacing: -0.05em;
      }

      .front-side span {
        display: block;
        margin-top: 36px;
        color: #f45116;
        font-size: 118px;
        line-height: 1;
        font-weight: 900;
        text-align: center;
        letter-spacing: -0.06em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="stripe"></div>
      <section class="inner">
        <div>
          <header class="brand">
            <img src="/brand/luis-one-logo.jpg" alt="Luis One logo" />
            <div>
              <strong>Luis One</strong>
              <span>MOTO SUPPLY PH</span>
            </div>
          </header>

          <h1>Thank you for your order!</h1>
          <p class="text">Follow our Facebook page for new products, restock updates, and promo updates.</p>

          <div class="search-box">Search on Shopee: luisone</div>

          <div class="chips">
            <span class="chip">New products</span>
            <span class="chip">Updates</span>
            <span class="chip">Promos</span>
          </div>
        </div>

        <aside class="front-side">
          <div>
            <strong>Save our<br />Shopee shop</strong>
            <span>luisone</span>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
